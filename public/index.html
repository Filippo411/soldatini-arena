<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <!-- niente zoom e barre: lo schermo grande si adatta a TV, iPad e telefono -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pippo">
  <meta name="theme-color" content="#1b1b26">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <title>Pippo Game Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/host.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><rect width='8' height='8' fill='%231b1b26'/><rect x='1' y='2' width='6' height='4' fill='%23ffd23b'/><rect x='2' y='3' width='1' height='1' fill='%231b1b26'/><rect x='5' y='3' width='1' height='1' fill='%23ff3b3b'/><rect x='4' y='4' width='1' height='1' fill='%232f8bff'/></svg>">
</head>
<body class="host">
  <!-- Se qualcosa va storto (es. browser della TV troppo vecchio) lo mostriamo a schermo -->
  <script>
    window.onerror = function (msg, src, line) {
      var d = document.getElementById('errbox');
      if (!d) { d = document.createElement('div'); d.id = 'errbox'; d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#a3172a;color:#fff;font:14px monospace;padding:10px;white-space:pre-wrap'; document.body.appendChild(d); }
      d.textContent += 'ERRORE: ' + msg + ' (' + String(src || '').split('/').pop() + ':' + line + ')\nBrowser: ' + navigator.userAgent + '\n';
    };
  </script>
  <!-- Il gioco: canvas a bassa risoluzione ingrandito a schermo intero -->
  <div id="stage"><canvas id="game"></canvas></div>

  <!-- MENU: QR, giochi, squadra con classifica della serata -->
  <div id="hub" class="overlay">
    <h1 class="logo"><canvas id="logo" aria-label="Pippo Game Room"></canvas></h1>
    <div class="hub-grid">
      <div class="panel join">
        <div class="qr-wrap"><canvas id="qr"></canvas></div>
        <p class="hint">INQUADRA IL QR</p>
        <p class="small">oppure vai su</p>
        <p class="url" id="joinUrl">...</p>
        <p class="small">codice stanza</p>
        <p class="code" id="roomCode">----</p>
      </div>

      <div class="panel games">
        <h2>SCEGLI IL GIOCO</h2>
        <div id="gameCards" class="game-cards"></div>
        <p class="gdesc" id="gameDesc"></p>
        <p class="small" id="gamePlayers"></p>
        <button id="playBtn" class="btn big">GIOCA!</button>
        <p class="small">FRECCE + INVIO · oppure il capo sceglie dal telefono</p>
      </div>

      <div class="panel roster">
        <h2>CLASSIFICA SERATA</h2>
        <ul id="slots"></ul>
        <p class="small" id="hubHint"></p>
        <button id="resetBtn" class="btn tiny hidden">AZZERA PUNTI</button>
      </div>
    </div>
    <div id="netStatus" class="net-status">CONNESSIONE AL SERVER...</div>
  </div>

  <!-- FINE PARTITA: classifica -->
  <div id="over" class="overlay hidden">
    <p class="over-game" id="overGame"></p>
    <h1 class="winner" id="winnerTitle">WINNER!</h1>
    <p class="winner-name" id="winnerName"></p>
    <table class="ranking"><tbody id="rankBody"></tbody></table>
    <div class="over-buttons">
      <button id="againBtn" class="btn big">RIGIOCA</button>
      <button id="lobbyBtn" class="btn">MENU GIOCHI</button>
    </div>
    <p class="small">INVIO = rigioca · ESC = menu · anche dal telefono del capo</p>
  </div>

  <!-- Barra strumenti (audio / schermo intero) -->
  <div id="toolbar">
    <button id="audioBtn" class="btn pulse">ATTIVA L'AUDIO</button>
    <button id="muteBtn" class="btn tiny hidden" title="Audio on/off (M)">AUDIO ON</button>
    <button id="fsBtn" class="btn tiny" title="Schermo intero (F)">SCHERMO INTERO</button>
  </div>

  <!--
    Caricamento degli script.
    I browser moderni usano i file sorgente in js/. I browser vecchi (molte smart TV)
    ricevono legacy/host.js, la stessa cosa tradotta in JavaScript "vecchio stile"
    (si rigenera con: node tools/build-legacy.js). Con ?legacy=1 si forza la versione vecchia.
  -->
  <script>
    var HOST_SCRIPTS = [
      'js/common/net.js',
      'js/common/fullscreen.js',
      'js/common/qr.js',
      'js/common/icons.js',
      'js/core/registry.js',
      'js/core/font.js',
      'js/common/logo.js',
      'js/core/audio.js',
      'js/games/shooter/config.js',
      'js/games/shooter/map.js',
      'js/games/shooter/sprites.js',
      'js/games/shooter/bots.js',
      'js/games/shooter/game.js',
      'js/games/shooter/render.js',
      'js/games/shooter/index.js',
      'js/games/sheep/config.js',
      'js/games/sheep/map.js',
      'js/games/sheep/art.js',
      'js/games/sheep/bots.js',
      'js/games/sheep/game.js',
      'js/games/sheep/render.js',
      'js/games/sheep/index.js',
      'js/games/diff/scene.js',
      'js/games/diff/game.js',
      'js/games/diff/index.js',
      'js/games/kart/chars.js',
      'js/games/kart/tracks.js',
      'js/games/kart/world.js',
      'js/games/kart/art.js',
      'js/games/kart/game.js',
      'js/games/kart/render.js',
      'js/games/kart/index.js',
      'js/games/billionaire/config.js',
      'js/games/billionaire/questions.js',
      'js/games/billionaire/game.js',
      'js/games/billionaire/render.js',
      'js/games/billionaire/index.js',
      'js/games/upcoming.js',
      'js/room/host.js'
    ];
    (function () {
      var modern = false;
      try { new Function('class A {}; let f = (x) => x; const { b } = { b: 1 }; async function g() { await 1; } return `${f(1)}`;'); modern = true; } catch (e) {}
      if (/[?&]legacy=1/.test(location.search)) modern = false;
      var list = modern ? HOST_SCRIPTS : ['legacy/host.js'];
      for (var i = 0; i < list.length; i++) {
        var el = document.createElement('script');
        el.src = list[i];
        el.async = false;            // rispetta l'ordine
        document.body.appendChild(el);
      }
    })();
  </script>
</body>
</html>
